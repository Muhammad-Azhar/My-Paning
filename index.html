<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner ของฉัน</title>

<style>
:root{--bg:#eaf7ee;--card:#fff;--c2:#dff3e6;--ink:#1f3a2b;--mute:#5c7d69;--line:#c4e5cf;--ac:#2f9e6a;--b1:#2f9e6a;--b2:#46b985;--bi:#fff;--bad:#d8605f;--sv:#2b8fa3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2017;--card:#16301f;--c2:#1f4130;--ink:#e4f6ea;--mute:#98bba5;--line:#2c5240;--ac:#6fe3a0;--b1:#7be0a8;--b2:#a9f0c9;--bi:#0c1d14;--bad:#ff8b8a;--sv:#7ad0e0}}
:root[data-theme="dark"]{--bg:#0e2017;--card:#16301f;--c2:#1f4130;--ink:#e4f6ea;--mute:#98bba5;--line:#2c5240;--ac:#6fe3a0;--b1:#7be0a8;--b2:#a9f0c9;--bi:#0c1d14;--bad:#ff8b8a;--sv:#7ad0e0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;line-height:1.45;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:16px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:1.35rem;margin:0}
.pill{font:inherit;border:0;background:var(--c2);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600}
.ib{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;width:42px;height:42px;cursor:pointer;font-size:1.1rem}
.seg{display:flex;background:var(--c2);border-radius:99px;padding:5px;margin-bottom:14px}
.seg button{flex:1;font:inherit;border:0;background:none;color:var(--mute);padding:9px 0;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ac);font-weight:700}
.dn{display:flex;gap:8px;align-items:center}
.dn .lb{flex:1;position:relative;text-align:center;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:9px 4px}
.dn .lb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.vw{color:var(--mute);margin:10px 4px 14px;font-size:.92rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:16px;margin-bottom:12px}
.card.f{background:var(--c2)}
h2{font-size:1rem;margin:0 0 10px}
input[type=text],input[type=number],input[type=time],select{font:inherit;width:100%;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:9px 12px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{font:inherit;font-weight:700;width:100%;border:0;border-radius:20px;padding:13px;background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--bi);cursor:pointer;font-size:1rem}
.btn:active,.ib:active,.pill:active{transform:scale(.95)}
.bar{height:14px;border-radius:99px;background:var(--c2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b1),var(--b2));border-radius:99px;transition:width .5s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.8rem;color:var(--mute)}
.wk button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.wk i{display:block;height:46px;border-radius:14px;margin-bottom:4px;border:2px solid transparent}
.wk .sel i{border-color:var(--ac)}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
.it.cls{border-left:6px solid var(--b1)}
.it.done .nm{text-decoration:line-through;opacity:.55}
.grow{flex:1;min-width:0}
.nm{font-weight:600;font-size:1rem}.nm b{color:var(--ac)}
.sub{color:var(--mute);font-size:.85rem}
.tag{display:inline-block;background:var(--b1);color:var(--bi);border-radius:99px;padding:0 10px;font-size:.8rem;font-weight:700;margin-left:4px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:32px;height:32px;border:3px solid var(--ac);border-radius:50%;flex:none;margin:0;cursor:pointer;display:grid;place-items:center}
input[type=checkbox]:checked{background:var(--ac)}
input[type=checkbox]:checked::after{content:"✓";color:var(--bi);font-weight:700}
.em{font-size:1.5rem;flex:none;width:32px;text-align:center}
.x{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;padding:0 4px}
summary{list-style:none;cursor:pointer;color:var(--mute);margin-top:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ ";font-size:.75rem}
details[open] summary::before{content:"▼ "}
details ul{margin:6px 0 0;padding-left:20px;color:var(--mute);font-size:.92rem}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mt .card{margin:0;text-align:center;padding:16px 8px}
.mt b{display:block;font-size:1.35rem}
.in{color:var(--ac)}.out{color:var(--bad)}.svc{color:var(--sv)}
.empty{text-align:center;color:var(--mute);border:2px solid var(--line);border-radius:28px;padding:22px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
nav button{font:inherit;font-size:.85rem;flex:1;border:0;background:none;color:var(--mute);border-radius:22px;padding:6px 0;cursor:pointer}
nav button b{display:block;font-size:1.4rem;font-weight:400;line-height:1.3}
nav button.on{background:var(--c2);color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:520px;margin:auto;z-index:20;background:var(--ac);color:var(--bi);padding:12px 16px;border-radius:22px;font-weight:600;transform:translateY(-160%);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
#toast.show{transform:none}
.sp{position:fixed;z-index:30;pointer-events:none;font-size:18px;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.lf{position:fixed;top:-30px;z-index:0;pointer-events:none;opacity:.4;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lf{display:none}.sp{animation:none;opacity:0}#toast,.bar i{transition:none}}
</style>
</head>
<body>
<main>
 <div class="top"><h1>🍀 Planner ของฉัน</h1><div style="display:flex;gap:6px"><button class="pill" id="bell" data-a="bell"></button><button class="ib" id="th" data-a="theme" aria-label="โหมดกลางวัน/กลางคืน"></button></div></div>
 <div class="seg" id="seg"></div>
 <div class="dn"><button class="ib" data-a="prev" aria-label="ก่อนหน้า">‹</button><div class="lb"><span id="dl"></span><input type="date" id="dp" data-a="jump" aria-label="เลือกวันที่"></div><button class="ib" data-a="next" aria-label="ถัดไป">›</button><button class="pill" data-a="today">วันนี้</button></div>
 <div class="vw" id="vw"></div>
 <div id="view"></div>
</main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const nf=n=>Math.round(n).toLocaleString('id-ID');
const today=()=>ymd(new Date());
const WD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],WS=['อาท','จัน','อัง','พุธ','พฤห','ศุก','เสา'];
const TH=o=>o.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const T="Theater KH. Abdullah Masduki";
const CL=[[1,"Metode dan Strategi Pembelajaran Inovatif",T,"07:00","08:40"],[1,"Manajemen Kelas",T,"08:45","10:25"],[2,"Kewirausahaan",T,"14:45","16:25"],[3,"Living Values Education Program (LVEP)","MAM 403","07:00","08:40"],[3,"Pendidikan Karakter","MAM 403","08:45","10:25"],[4,"Kealmaatan 3: Aqidah dan Profesi","AM 303","10:30","12:10"],[4,"Pembelajaran Inklusif dan Diferensiasi","MAM 402","14:45","16:25"],[5,"Pembelajaran Berbasis IT","Lab CBT","10:30","12:10"],[5,"Profesi Keguruan","MAM 403","13:00","14:40"],[5,"Evaluasi Pembelajaran","AM 303","14:45","16:25"]].map(([day,name,room,s,e],k)=>({id:'c'+k,kind:'class',day,name,room,s,e,notes:[]}));
const RT=[
["04:30","05:30","Bangun tidur dan Subuh",["Bangun dengan berdoa, membersihkan diri, bersiwak atau menyikat gigi, lalu berwudu.","Salat Subuh dan berzikir.","Minum air putih sesuai kebutuhan.","Lakukan peregangan ringan selama 5–10 menit.","Jika masih mengantuk karena kurang tidur, utamakan memperbaiki durasi tidur malam."]],
["06:00","08:00","Sarapan",["Pilih makanan yang memberikan energi dan protein, misalnya:","Telur 2 butir.","Nasi atau roti gandum secukupnya.","Pisang atau buah lain.","Air putih."]],
["08:00","12:00","Kuliah atau bekerja",["Hindari duduk terus-menerus; berdiri dan bergerak setiap 30–60 menit.","Minum air secara berkala.","Jika lapar, makan buah, yoghurt, atau kacang secukupnya.","Jaga postur duduk agar punggung dan leher tidak terus-menerus membungkuk."]],
["12:00","13:30","Makan siang dan Zuhur",["Makan nasi secukupnya, ayam atau ikan, tempe atau tahu, serta sayuran.","Makan dengan tenang dan berhenti sebelum terlalu kenyang.","Salat Zuhur.","Jika ingin beristirahat, jalan santai sebentar sebelum duduk atau berbaring."]],
["15:00","17:30","Aktivitas dan latihan otot",["Setelah Asar atau pada waktu yang sesuai:","Pemanasan 5–10 menit.","Squat, push-up, latihan punggung, dan plank.","Mulai 20–30 menit, 2–3 kali seminggu.","Akhiri dengan gerakan ringan dan pendinginan."]],
["18:00","20:00","Makan malam dan Magrib–Isya",["Makan malam dengan sumber protein, sayuran, dan karbohidrat secukupnya.","Salat Magrib dan Isya sesuai waktunya.","Selesaikan tugas dan aktivitas penting.","Hindari makan dalam jumlah sangat besar tepat sebelum tidur."]],
["21:00","22:00","Persiapan tidur",["Kurangi penggunaan ponsel dan cahaya terang.","Bersihkan diri, berwudu bila memungkinkan, dan baca doa tidur.","Tidur dengan posisi nyaman, termasuk miring ke kanan jika nyaman.","Usahakan tidur 7–9 jam setiap malam bagi orang dewasa."]]
].map(([s,e,name,notes],k)=>({id:'r'+k,kind:'routine',name,s,e,notes}));
let S;
try{const n=JSON.parse(localStorage.getItem('jdm2')||'null');if(n)S=n;else{
 const o=JSON.parse(localStorage.getItem('jdm1')||'{}'),st=s=>String(s).replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,'');
 S={items:[...CL,...(o.routine?o.routine.map(r=>({id:r.id,kind:'routine',name:st(r.t),s:r.s,e:r.e||'',notes:r.i||[]})):RT)],tasks:o.tasks||[],done:o.done||{},tx:[...(o.tx||[]),...(o.dep||[]).map(d=>({id:d.id,date:d.date,type:'sv',amt:d.amt,note:'ออม'}))],theme:o.theme||'',bell:!!o.bell}}}
catch(e){S={items:[...CL,...RT],tasks:[],done:{},tx:[],theme:'',bell:false}}
const save=()=>{try{localStorage.setItem('jdm2',JSON.stringify(S))}catch(e){}};
let cur=today(),tab='jd',rg='d';const OP=new Set();
const val=id=>($('#'+id)||{}).value||'';
const bar=p=>'<div class="bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>';
const dayItems=d=>{const w=pd(d).getDay();return S.items.filter(i=>i.kind==='class'?i.day===w:i.kind==='routine'||i.date===d).sort((a,b)=>a.s.localeCompare(b.s))};
const chk=d=>dayItems(d).filter(i=>i.kind!=='class');
const dstat=d=>{const l=chk(d),o=S.done[d]||{};return{t:d>today()?0:l.length,k:l.filter(i=>o[i.id]).length}};
const money=ds=>{const x=S.tx.filter(t=>ds.has(t.date)),f=ty=>x.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0),i=f('in'),o=f('out'),v=f('sv');return{i,o,v,b:i-o-v}};
const delBtn=(a,id)=>'<button class="x" data-a="'+a+'" data-id="'+id+'" aria-label="ลบ">✕</button>';

function dayView(){
 const o=S.done[cur]||{},l=chk(cur),k=l.filter(i=>o[i.id]).length,p=l.length?Math.round(k/l.length*100):0,w=pd(cur).getDay(),live=cur===today(),n=new Date(),m=n.getHours()*60+n.getMinutes();
 let strip='';for(let q=6;q>=0;q--){const d=pd(cur);d.setDate(d.getDate()-q);const s=ymd(d),t=chk(s),dn=t.filter(i=>(S.done[s]||{})[i.id]).length,pc=t.length?dn/t.length*100:0;
  strip+='<button class="'+(q===0?'sel':'')+'" data-a="goto" data-d="'+s+'"><i style="background:linear-gradient(to top,var(--ac) '+pc+'%,var(--c2) '+pc+'%)"></i>'+WS[d.getDay()]+'</button>'}
 return '<div class="card"><h2>กิจวัตรวันนี้ '+p+'% '+(p===100?'🍀':p>=50?'🌿':'🌱')+'</h2>'+bar(p)+'<div class="wk">'+strip+'</div></div>'+
 '<div class="card f"><h2>➕ เพิ่มลงตารางวัน'+WD[w]+'</h2><div class="g2"><select id="ak"><option value="class">📚 วิชาเรียน (ทุกสัปดาห์)</option><option value="routine">🌿 กิจวัตร (ทุกวัน)</option><option value="once">📌 เฉพาะวันนี้</option></select><input type="text" id="ar" placeholder="ห้อง (เฉพาะวิชา)"></div><input type="text" id="an" placeholder="ชื่อ" style="margin-bottom:10px"><div class="g2"><input type="time" id="as" aria-label="เริ่ม" value="09:00"><input type="time" id="ae" aria-label="จบ" value="10:00"></div><button class="btn" data-a="iadd">บันทึก 💚</button></div>'+
 dayItems(cur).map(i=>{const now=live&&m>=mins(i.s)&&(!i.e||m<mins(i.e));const tm='<b>'+i.s+(i.e?'–'+i.e:'')+'</b> ';const tg=now?'<span class="tag">ตอนนี้</span>':'';
  const dt=i.notes&&i.notes.length?'<details data-id="'+i.id+'" '+(OP.has(i.id)?'open':'')+'><summary>ดูรายละเอียด</summary><ul>'+i.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>':'';
  if(i.kind==='class')return '<div class="it cls"><span class="em">📚</span><div class="grow"><div class="nm">'+tm+esc(i.name)+tg+'</div><div class="sub">ห้อง '+esc(i.room||'-')+'</div></div>'+delBtn('idel',i.id)+'</div>';
  return '<div class="it '+(o[i.id]?'done':'')+'"><input type="checkbox" data-a="itog" data-id="'+i.id+'" '+(o[i.id]?'checked':'')+' aria-label="ทำแล้ว"><div class="grow"><div class="nm">'+tm+esc(i.name)+tg+'</div>'+dt+'</div>'+delBtn('idel',i.id)+'</div>'}).join('')}
function taskView(){
 const l=S.tasks.filter(t=>t.date===cur).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
 return '<div class="card f"><h2>➕ เพิ่มงานของวันที่เลือก</h2><input type="text" id="tn" placeholder="ต้องทำอะไรบ้างนะ" style="margin-bottom:10px"><div class="g2"><input type="time" id="tt" aria-label="เวลา"><button class="btn" data-a="tadd">บันทึก 💚</button></div><div class="sub">ใส่เวลาไว้ถ้าอยากให้เตือน</div></div>'+
 (l.length?l.map(t=>'<div class="it '+(t.done?'done':'')+'"><input type="checkbox" data-a="ttog" data-id="'+t.id+'" '+(t.done?'checked':'')+' aria-label="เสร็จแล้ว"><div class="grow"><div class="nm">'+esc(t.text)+'</div>'+(t.time?'<div class="sub">⏰ '+t.time+'</div>':'')+'</div>'+delBtn('tdel',t.id)+'</div>').join(''):'<div class="empty">ยังไม่มีงานในวันนี้ 🌿</div>')}
function moneyView(){
 const m=money(new Set([cur])),allsv=S.tx.filter(t=>t.type==='sv').reduce((s,t)=>s+t.amt,0),l=S.tx.filter(t=>t.date===cur),NM={in:'รายรับ',out:'รายจ่าย',sv:'เงินออม'};
 return '<h2 style="margin:0 4px 12px">สรุปวัน'+WD[pd(cur).getDay()]+' '+cur+'</h2><div class="mt"><div class="card">รายรับ<b class="in">'+nf(m.i)+'</b></div><div class="card">รายจ่าย<b class="out">'+nf(m.o)+'</b></div><div class="card">เงินออม<b class="svc">'+nf(m.v)+'</b><span class="sub">สะสม '+nf(allsv)+'</span></div><div class="card">คงเหลือ<b>'+nf(m.b)+'</b></div></div>'+
 '<div class="card f"><h2>➕ บันทึกวันที่ '+cur+'</h2><div class="g2"><select id="ft"><option value="out">รายจ่าย</option><option value="in">รายรับ</option><option value="sv">เงินออม</option></select><input type="number" inputmode="numeric" id="fa" placeholder="จำนวนเงิน"></div><input type="text" id="fn" placeholder="รายละเอียด เช่น ข้าว, ค่าขนม" style="margin-bottom:10px"><button class="btn" data-a="fadd">บันทึก 💚</button></div>'+
 l.map(t=>'<div class="it"><div class="grow"><div class="nm">'+esc(t.note||NM[t.type])+'</div><div class="sub">'+NM[t.type]+'</div></div><b class="'+(t.type==='sv'?'svc':t.type)+'">'+(t.type==='out'?'−':'+')+nf(t.amt)+'</b>'+delBtn('fdel',t.id)+'</div>').join('')}
function bounds(){const r=pd(cur);let a,b;if(rg==='w'){const k=(r.getDay()+6)%7;a=new Date(r);a.setDate(r.getDate()-k);b=new Date(a);b.setDate(a.getDate()+6)}else if(rg==='m'){a=new Date(r.getFullYear(),r.getMonth(),1);b=new Date(r.getFullYear(),r.getMonth()+1,0)}else{a=new Date(r.getFullYear(),0,1);b=new Date(r.getFullYear(),11,31)}return[a,b]}
const dl=(a,b)=>{const o=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))o.push(ymd(d));return o};
function rangeView(){
 const [a,b]=bounds(),y=a.getFullYear(),bk=rg==='y'?[...Array(12)].map((_,m)=>({l:new Date(y,m,1).toLocaleDateString('th-TH',{month:'short'}),d:dl(new Date(y,m,1),new Date(y,m+1,0))})):dl(a,b).map(s=>({l:pd(s).getDate()+' '+WS[pd(s).getDay()],d:[s]}));
 const cols={jd:['ทำแล้ว','ทั้งหมด','%'],tg:['เสร็จ','ทั้งหมด','%'],fn:['รับ','จ่าย','ออม','เหลือ']}[tab];
 const rows=bk.map(x=>{const ds=new Set(x.d);let v;
  if(tab==='jd'){const s=x.d.map(dstat);const k=s.reduce((p,q)=>p+q.k,0),t=s.reduce((p,q)=>p+q.t,0);v=[k,t,t?Math.round(k/t*100)+'%':'-']}
  else if(tab==='tg'){const l=S.tasks.filter(t=>ds.has(t.date)),k=l.filter(t=>t.done).length;v=[k,l.length,l.length?Math.round(k/l.length*100)+'%':'-']}
  else{const m=money(ds);v=[m.i,m.o,m.v,m.b]}return{l:x.l,v}});
 const tot=cols.map((_,j)=>{if(tab!=='fn'&&j===2){const k=rows.reduce((p,r)=>p+r.v[0],0),t=rows.reduce((p,r)=>p+r.v[1],0);return t?Math.round(k/t*100)+'%':'-'}return rows.reduce((p,r)=>p+r.v[j],0)});
 const f=v=>typeof v==='number'?(v?nf(v):'-'):v;
 const mm=tab==='fn'?money(new Set(dl(a,b))):null;
 return (mm?'<div class="mt"><div class="card">รายรับ<b class="in">'+nf(mm.i)+'</b></div><div class="card">รายจ่าย<b class="out">'+nf(mm.o)+'</b></div><div class="card">เงินออม<b class="svc">'+nf(mm.v)+'</b></div><div class="card">คงเหลือ<b>'+nf(mm.b)+'</b></div></div>':'')+
 '<div class="card tbl"><table><thead><tr><th></th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.l+'</td>'+r.v.map(v=>'<td>'+f(v)+'</td>').join('')+'</tr>').join('')+'</tbody><tfoot><tr><td>รวม</td>'+tot.map(v=>'<td>'+f(v)+'</td>').join('')+'</tr></tfoot></table></div>'}
const TABS=[['jd','📚','ตารางวัน'],['tg','✨','งาน'],['fn','💰','การเงิน']];
function render(){
 const dk=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
 $('#th').textContent=dk?'☀️':'🌙';$('#bell').textContent=S.bell?'🔔 เตือนอยู่':'🔕 เปิดเตือน';
 $('#seg').innerHTML=[['d','รายวัน'],['w','รายสัปดาห์'],['m','รายเดือน'],['y','รายปี']].map(([k,n])=>'<button class="'+(rg===k?'on':'')+'" data-a="rg" data-v="'+k+'">'+n+'</button>').join('');
 const [a,b]=bounds();
 $('#dl').textContent=rg==='d'?TH(pd(cur)):rg==='w'?a.getDate()+'–'+TH(b):rg==='m'?a.toLocaleDateString('th-TH',{month:'long',year:'numeric'}):'ปี '+(a.getFullYear()+543);
 $('#vw').textContent=rg==='d'?'กำลังดู: วัน'+WD[pd(cur).getDay()]+' '+cur:'กำลังดู: '+ymd(a)+' ถึง '+ymd(b);
 $('#dp').value=cur;
 $('#nav').innerHTML=TABS.map(([k,e,n])=>'<button class="'+(tab===k?'on':'')+'" data-a="tab" data-v="'+k+'"><b>'+e+'</b>'+n+'</button>').join('');
 $('#view').innerHTML=rg!=='d'?rangeView():tab==='jd'?dayView():tab==='tg'?taskView():moneyView();
}
function burst(x,y,n){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const em=['✨','🍀','💚','🌿','🍃'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='sp';s.textContent=em[i%em.length];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--dy',(-30-Math.random()*90)+'px');s.style.setProperty('--r',(Math.random()*120-60)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
for(let i=0;i<7;i++){const l=document.createElement('span');l.className='lf';l.textContent=['🍃','🌿','🍀','🦋'][i%4];l.style.left=(i*15+3)+'%';l.style.fontSize=(16+i%3*6)+'px';l.style.animationDuration=(14+i*3)+'s';l.style.animationDelay=(-i*4)+'s';document.body.appendChild(l)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),6000)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}}
const fired={};
function tick(){if(!S.bell)return;const n=new Date(),d=ymd(n),m=n.getHours()*60+n.getMinutes(),L=[];
 dayItems(d).forEach(i=>L.push({id:i.id,t:mins(i.s)-(i.kind==='class'?10:0),h:(i.kind==='class'?'📚 ':'🌿 ')+i.name,b:(i.kind==='class'?'ห้อง '+(i.room||'-')+' · ':'')+i.s}));
 S.tasks.filter(t=>t.date===d&&t.time&&!t.done).forEach(t=>L.push({id:t.id,t:mins(t.time),h:'✨ '+t.text,b:'เวลา '+t.time}));
 L.forEach(x=>{const k=d+x.id;if(!fired[k]&&m>=x.t&&m-x.t<=2){fired[k]=1;toast('🔔 '+x.h+' — '+x.b);beep();try{if(window.Notification&&Notification.permission==='granted')new Notification(x.h,{body:x.b})}catch(e){}}})}
setInterval(tick,15000);
const shift=n=>{const d=pd(cur);if(rg==='d'||rg==='w')d.setDate(d.getDate()+n*(rg==='w'?7:1));else if(rg==='m'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setFullYear(d.getFullYear()+n);cur=ymd(d)};
const A={
tab(b){tab=b.dataset.v},rg(b){rg=b.dataset.v},prev(){shift(-1)},next(){shift(1)},today(){cur=today()},goto(b){cur=b.dataset.d},jump(b){if(b.value)cur=b.value},
theme(){const dk=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dk?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme)},
bell(){S.bell=!S.bell;if(S.bell){try{window.Notification&&Notification.requestPermission()}catch(e){}toast('🔔 เปิดเตือนแล้ว (ต้องเปิดหน้านี้ค้างไว้)');beep()}},
iadd(){const n=val('an').trim(),k=val('ak');if(!n)return;S.items.push({id:uid(),kind:k,day:pd(cur).getDay(),date:cur,name:n,room:val('ar').trim(),s:val('as')||'09:00',e:val('ae'),notes:[]})},
idel(b){S.items=S.items.filter(i=>i.id!==b.dataset.id)},
itog(b){S.done[cur]=S.done[cur]||{};S.done[cur][b.dataset.id]=b.checked;if(b.checked){const r=b.getBoundingClientRect();burst(r.left,r.top,10)}},
tadd(){const t=val('tn').trim();if(t)S.tasks.push({id:uid(),date:cur,text:t,time:val('tt'),done:false})},
ttog(b){const t=S.tasks.find(x=>x.id===b.dataset.id);t.done=b.checked;if(b.checked){const r=b.getBoundingClientRect();burst(r.left,r.top,10)}},
tdel(b){S.tasks=S.tasks.filter(x=>x.id!==b.dataset.id)},
fadd(){const a=+val('fa');if(a>0){S.tx.push({id:uid(),date:cur,type:val('ft'),amt:a,note:val('fn').trim()});if(val('ft')==='sv')burst(innerWidth/2,innerHeight/2,12)}},
fdel(b){S.tx=S.tx.filter(x=>x.id!==b.dataset.id)}
};
function go(b,e){const f=A[b.dataset.a];if(!f)return;if(e&&e.type==='click'&&e.clientX)burst(e.clientX,e.clientY,5);f(b);save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.type!=='date')go(b,e)});
document.addEventListener('change',e=>{const b=e.target.closest('input[type=date][data-a]');if(b)go(b,e)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id){d.open?OP.add(d.dataset.id):OP.delete(d.dataset.id)}},true);
render();tick();
</script>
